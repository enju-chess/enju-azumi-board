<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>モメンタム10銘柄</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#5f5f66;--line:#e4e2dc;--accent:#0b6e4f;
--up:#c62828;--down:#1565c0;--warn:#b26a00;--chip:#eef3f0}
@media (prefers-color-scheme:dark){:root{--bg:#121315;--card:#1c1d20;--ink:#eceae5;--sub:#a3a19b;
--line:#2c2d31;--accent:#5fc6a1;--up:#ff7a7a;--down:#7ab5ff;--warn:#f0b35a;--chip:#22302a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
line-height:1.55;font-size:15px}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:21px;margin:4px 0 2px}
.meta{color:var(--sub);font-size:12.5px}
h2{font-size:16px;margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--sub);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.rk{font-weight:700;color:var(--sub);text-align:center}
.nm{min-width:0}.nm b{font-size:15px}.nm a{color:inherit;text-decoration:none}
.nm .t{color:var(--sub);font-size:12px;margin-left:6px}
.nm .s{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;font-size:13px;white-space:nowrap}.num .m{color:var(--up);font-weight:700;font-size:14px}
label.hold{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);justify-content:flex-end;margin-top:3px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.plan{padding:12px}
.plan p{margin:4px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;margin:2px 4px 2px 0;background:var(--chip)}
.sell{color:var(--down)}.buy{color:var(--up)}
.budget{display:flex;gap:8px;align-items:center;margin:8px 0 4px;font-size:14px}
.budget input{width:110px;font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--sub);font-weight:400;font-size:12px}
.note{color:var(--sub);font-size:12.5px;margin:8px 2px}
.warn{color:var(--warn)}
details{margin-top:8px}summary{cursor:pointer;color:var(--sub);font-size:13px}
.new{font-size:11px;color:var(--warn);margin-left:4px}
.tabs{display:flex;gap:6px;margin:10px 0 4px}
.tabs button{flex:1;font-size:15px;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-weight:700}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dip{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;background:var(--up);color:#fff;margin-left:4px}
.wait{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;border:1px solid var(--line);color:var(--sub);margin-left:4px}
button.act{font-size:13px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
</head>
<body>
<main>
<h1>モメンタム10銘柄</h1>
<div class="tabs"><button data-m="us">米国株</button><button data-m="jp">日本株</button></div>
<div class="meta" id="meta">読み込み中…</div>

<h2>今月持つ10銘柄 <small id="offdate"></small></h2>
<div class="card" id="official"></div>
<p class="note" id="offnote"></p>

<h2>入れ替えと買付額の目安</h2>
<div class="card plan">
  <div id="swap"></div>
  <div class="budget">予算 <input id="budget" type="number" inputmode="numeric" step="10" value="200"> 万円</div>
  <div style="overflow-x:auto"><table id="alloc"></table></div>
  <p class="note" id="allocnote"></p>
</div>

<h2>最新の暫定ランキング <small id="latdate"></small></h2>
<div class="card" id="latest"></div>
<p class="note">月の途中の参考です。<b>売買は月末の確定ランキングだけで行います。</b>途中で入れ替えないのがこのルールのポイントです。</p>

<h2>ルール</h2>
<div class="card plan">
  <p id="rule"></p>
  <p id="rule2"></p>
  <p class="warn" id="perf"></p>
  <details><summary>対象外にしているAI関連銘柄（<span id="exn"></span>）</summary><p class="note" id="excluded"></p></details>
</div>
</main>
<script>
const M = {
  us: { file: "signal.json", key: "momentum-us-holdings", cur: "$",
        link: t => `https://finance.yahoo.com/quote/${encodeURIComponent(t)}`,
        rule2: "上昇率＝7ヶ月前→1ヶ月前の株価の伸び（直近1ヶ月は除く）。月末の終値で判断し、翌営業日に売買。損切りはしない。",
        perf: "検証（2015〜2026年）では同じ銘柄群の均等投資より年+15%程度上回ったが、最大で−43%の下落があり、11年中数年は負けている。過去の成績は将来を保証しない。",
        allocnote: "1銘柄あたり予算の1/10。株数は1株単位で四捨五入（1株未満で買える証券会社なら金額どおりに）。" },
  jp: { file: "signal_jp.json", key: "momentum-jp-holdings", cur: "¥",
        link: t => `https://finance.yahoo.co.jp/quote/${encodeURIComponent(t)}`,
        rule2: "上昇率＝13ヶ月前→1ヶ月前の株価の伸び（直近1ヶ月は除く）。外れた銘柄は月末の翌営業日に売る。新しく入った銘柄は、終値が5日線を下回った翌営業日に買う（それまでは現金で待つ）。損切りはしない。",
        perf: "検証（2015〜2026年）では同じ銘柄群の均等投資より年+13%程度上回ったが、最大で−41%の下落があり、11年中4年は負けている。過去の成績は将来を保証しない。",
        allocnote: "1銘柄あたり予算の1/10。ミニ株（1株単位）で計算。" },
};
const load = k => { try { return JSON.parse(localStorage.getItem(k)) } catch (e) { return null } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(0) + "%";
const code = t => t.replace(/\.T$/, "");
let mk = new URLSearchParams(location.search).get("m") || load("momentum-tab") || "us";
let D, held, cfg;
const cache = {};

const money = p => cfg.cur + p.toLocaleString(undefined, { maximumFractionDigits: cfg.cur === "$" ? 2 : 0 });

function badge(r, isHeld) {
  if (!D.dip_rule || isHeld) return "";
  return r.dip ? '<span class="dip">押し目・買い時</span>' : '<span class="wait">押し目待ち</span>';
}

function rowsHTML(list, withHold, prevSet) {
  return list.slice(0, 10).map((r, i) => `
    <div class="row">
      <div class="rk">${i + 1}</div>
      <div class="nm"><a href="${cfg.link(r.ticker)}" target="_blank" rel="noopener"><b>${r.name}</b><span class="t">${code(r.ticker)}</span></a>
        ${prevSet && !prevSet.has(r.ticker) ? '<span class="new">今月の10銘柄外</span>' : ""}
        ${withHold ? badge(r, held.has(r.ticker)) : ""}
        <div class="s">${r.sector}</div></div>
      <div class="num"><div class="m">${pct(r.momentum)}</div>${money(r.price)}
        ${withHold ? `<label class="hold"><input type="checkbox" data-t="${r.ticker}" ${held.has(r.ticker) ? "checked" : ""}>保有</label>` : ""}</div>
    </div>`).join("");
}

const tags = l => l.map(t => `<span class="tag">${code(t)}</span>`).join("");

function renderPlan() {
  const top = D.official.top.slice(0, 10);
  const topSet = new Set(top.map(r => r.ticker));
  const sell = [...held].filter(t => !topSet.has(t));
  const buy = top.filter(r => !held.has(r.ticker));
  let h = "";
  if (!held.size) h = "<p>保有銘柄が未登録です。上の一覧でチェックすると入れ替えが分かります。</p>";
  if (held.size && !sell.length && !buy.length) h = "<p>入れ替えなし。今月はこのまま持ち続けます。</p>";
  if (sell.length) h += `<p class="sell"><b>売る</b>（10銘柄から外れた）: ${tags(sell)}</p>
      <p><button id="sold" class="act">売却済みにする</button></p>`;
  if (buy.length && held.size) {
    if (D.dip_rule) {
      const now = buy.filter(r => r.dip), wait = buy.filter(r => !r.dip);
      if (now.length) h += `<p class="buy"><b>買う</b>（押し目が出た・次の営業日に）: ${tags(now.map(r => r.ticker))}</p>`;
      if (wait.length) h += `<p><b>押し目待ち</b>（終値が5日線を下回るまで待つ）: ${tags(wait.map(r => r.ticker))}</p>`;
    } else {
      h += `<p class="buy"><b>買う</b>（新しく入った）: ${tags(buy.map(r => r.ticker))}</p>`;
    }
  }
  document.getElementById("swap").innerHTML = h;
  const sb = document.getElementById("sold");
  if (sb) sb.onclick = () => { sell.forEach(t => held.delete(t)); save(cfg.key, [...held]); render(); };

  const budget = (parseFloat(document.getElementById("budget").value) || 0) * 10000;
  save(cfg.key + "-budget", budget / 10000);
  const per = budget / 10, fx = D.usdjpy || 1;
  let total = 0;
  const lines = top.map(r => {
    const yenPrice = r.price * fx;
    const n = Math.max(1, Math.round(per / yenPrice));
    total += n * yenPrice;
    const dev = n * yenPrice / per - 1;
    return `<tr><td>${code(r.ticker)}</td><td>${money(r.price)}</td><td>${n}株</td>
      <td>${(n * yenPrice / 10000).toFixed(1)}万円</td><td style="color:${Math.abs(dev) > .3 ? "var(--warn)" : "var(--sub)"}">${pct(dev)}</td></tr>`;
  });
  document.getElementById("alloc").innerHTML =
    `<tr><th>銘柄</th><th>株価</th><th>株数</th><th>金額</th><th>目安との差</th></tr>${lines.join("")}
     <tr><td><b>合計</b></td><td></td><td></td><td><b>${(total / 10000).toFixed(1)}万円</b></td><td></td></tr>`;
}

function render() {
  const fxs = mk === "us" ? ` ／ 1ドル=${D.usdjpy}円` : "";
  document.getElementById("meta").textContent = `株価: ${D.price_date} 終値${fxs} ／ 更新 ${D.updated}`;
  document.getElementById("offdate").textContent = `${D.official.date} 月末で確定`;
  document.getElementById("latdate").textContent = `${D.latest.date} 時点`;
  document.getElementById("official").innerHTML = rowsHTML(D.official.top, true);
  document.getElementById("offnote").textContent = "持っている銘柄にチェックを入れると、下に入れ替え内容が出ます（チェックはこの端末だけに保存）。"
    + (D.dip_rule ? "「押し目・買い時」は最新の終値が5日線を下回った銘柄です。" : "");
  const offSet = new Set(D.official.top.slice(0, 10).map(r => r.ticker));
  document.getElementById("latest").innerHTML = rowsHTML(D.latest.top, false, offSet);
  document.getElementById("rule").textContent = D.rule;
  document.getElementById("rule2").textContent = cfg.rule2;
  document.getElementById("perf").textContent = cfg.perf;
  document.getElementById("allocnote").textContent = cfg.allocnote;
  document.getElementById("exn").textContent = D.excluded.length + "銘柄";
  document.getElementById("excluded").textContent = D.excluded.join("、");
  document.querySelectorAll("input[data-t]").forEach(c => c.addEventListener("change", e => {
    e.target.checked ? held.add(e.target.dataset.t) : held.delete(e.target.dataset.t);
    save(cfg.key, [...held]); render();
  }));
  renderPlan();
}

function show(m) {
  mk = M[m] ? m : "us"; cfg = M[mk]; save("momentum-tab", mk);
  held = new Set(load(cfg.key) || []);
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.m === mk));
  const b = load(cfg.key + "-budget");
  document.getElementById("budget").value = b || 200;
  const go = d => { D = d; render(); };
  if (cache[mk]) return go(cache[mk]);
  document.getElementById("meta").textContent = "読み込み中…";
  fetch(cfg.file + "?" + Date.now()).then(r => r.json()).then(d => { cache[mk] = d; if (cfg === M[mk]) go(d); })
    .catch(() => document.getElementById("meta").textContent = "データを読み込めませんでした");
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.m)));
document.getElementById("budget").addEventListener("input", () => D && renderPlan());
show(mk);
</script>
</body>
</html>
