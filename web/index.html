<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>今週のふたり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14161B;--card:#1F232B;--ink:#F2EFE8;--sub:#CFCAC0;--mute:#A8A49B;--amber:#F2B84B;--teal:#7FD3C1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;overflow:hidden}
#stage{width:1920px;height:1080px;transform-origin:0 0;position:absolute;left:0;top:0}
/* ---- board ---- */
.board{padding:30px 48px;display:flex;flex-direction:column;gap:14px;height:100%}
.head{display:flex;align-items:baseline;justify-content:space-between}
.head h1{margin:0;font-size:52px;font-weight:900}
.head .upd{font-size:24px;color:var(--mute);margin-left:28px}
.head .clock{font-size:40px;color:var(--sub)}
section h2{margin:0 0 10px;font-size:28px;font-weight:700;display:flex;gap:16px;align-items:baseline}
section h2 small{font-size:19px;color:var(--mute);font-weight:400}
.row{display:flex;gap:6px;overflow:hidden;scroll-behavior:smooth}
.card{flex:0 0 auto;position:relative;overflow:hidden;border-radius:10px;background:var(--card) center/cover no-repeat;outline:none}
.card:focus{box-shadow:0 0 0 5px var(--ink);z-index:1}
.card .shade{position:absolute;left:0;right:0;bottom:0;padding:56px 20px 16px;background:linear-gradient(to top,rgba(10,11,14,.95) 48%,rgba(10,11,14,0));display:flex;flex-direction:column;gap:4px}
.card .t{font-size:26px;font-weight:700;line-height:1.3}
.card .r{font-size:18px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{display:flex;align-items:baseline;gap:10px;white-space:nowrap;overflow:hidden}
.when b{font-size:32px;font-weight:900;color:var(--amber)}
.when span{font-size:18px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.chip{position:absolute;top:14px;left:16px;font-size:17px;font-weight:700;padding:4px 12px;border-radius:999px;color:#14161B}
.date{position:absolute;top:14px;left:16px;padding:6px 12px;border-radius:8px;background:rgba(10,11,14,.82);display:flex;align-items:baseline;gap:6px}
.date b{font-size:42px;font-weight:900;line-height:1}
.date span{font-size:20px;font-weight:700}
.tag{font-size:17px;font-weight:700}
.dim{opacity:.6}
.trip{box-shadow:inset 0 0 0 3px var(--teal)}
.empty{font-size:20px;color:var(--mute);padding:14px 22px;background:var(--card);border-radius:10px}
.soon{font-size:20px;color:var(--sub);margin-top:6px}
/* ---- saver ---- */
.saver{position:absolute;inset:0;background:#0E1013 center/cover no-repeat;transition:opacity 1.2s}
.saver .veil{position:absolute;inset:0;padding:96px 120px;background:linear-gradient(to right,rgba(10,11,14,.92) 40%,rgba(10,11,14,.35));display:flex;flex-direction:column;justify-content:space-between}
.saver .top{display:flex;justify-content:space-between;align-items:baseline}
.saver .top .lbl{font-size:32px;font-weight:700;color:var(--teal)}
.saver .top .clock{font-size:72px;color:var(--sub)}
.saver .items{display:flex;flex-direction:column;gap:40px}
.saver .it{display:flex;align-items:baseline;gap:48px}
.saver .it .d{width:380px;flex-shrink:0;display:flex;align-items:baseline;gap:12px}
.saver .it .d b{font-size:96px;font-weight:900;line-height:1}
.saver .it .d span{font-size:38px;font-weight:700;color:var(--sub)}
.saver .it .x .g{font-size:26px;font-weight:700}
.saver .it .x .n{font-size:54px;font-weight:700}
.saver .foot{font-size:24px;color:#8C8A85}
.err{padding:80px;font-size:32px}
/* ---- detail ---- */
.detail{position:absolute;inset:0;background:rgba(8,9,12,.92);display:flex;align-items:center;justify-content:center;z-index:10}
.detail .box{width:1500px;height:760px;border-radius:16px;overflow:hidden;display:flex;background:var(--card)}
.detail .pic{width:640px;flex-shrink:0;background:#2a2e36 center/cover no-repeat}
.detail .txt{padding:48px 56px;display:flex;flex-direction:column;gap:18px;min-width:0}
.detail .when2{font-size:40px;font-weight:900;color:var(--amber)}
.detail .ttl{font-size:52px;font-weight:900;line-height:1.25}
.detail .rsn{font-size:26px;color:var(--teal)}
.detail .sum{font-size:30px;line-height:1.7;color:var(--ink);flex:1}
.detail .hint{font-size:22px;color:var(--mute)}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var MODE = params.get('mode') === 'saver' ? 'saver' : 'board';
  var DATA_URL = params.get('data') || '../data/board.json';
  var DOW = ['日','月','火','水','木','金','土'];
  var PH = ['#4A3A2E','#3E4A35','#4B3F4F','#2F4555','#5A3434','#3A3550','#4E4A2E','#2E4A44'];
  var stage = document.getElementById('stage');

  // テレビのブラウザは画面幅を小さく報告することがあるので、取れる値のうち最小を使う
  function fit(){
    var vv = window.visualViewport;
    var w = Math.min(window.innerWidth || 1920, document.documentElement.clientWidth || 1920, vv ? vv.width : 1920);
    var h = Math.min(window.innerHeight || 1080, document.documentElement.clientHeight || 1080, vv ? vv.height : 1080);
    var s = Math.min(w/1920, h/1080);
    if(!(s > 0)) s = 1;
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  fit(); setTimeout(fit, 500); setTimeout(fit, 2000);

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function d(s){ var p = s.slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function md(dt){ return (dt.getMonth()+1) + '/' + dt.getDate(); }
  function dateParts(from, to){
    if(!from) return { main:'いつでも', sub:'' };
    var a = d(from), b = to ? d(to) : a;
    if(+a === +b) return { main: md(a), sub: DOW[a.getDay()] };
    var sub = DOW[a.getDay()] + '〜' + (a.getMonth()===b.getMonth() ? b.getDate() : md(b));
    return { main: md(a), sub: sub };
  }
  function bg(img, i){ return 'background-color:' + PH[i % PH.length] + (img ? ";background-image:url('" + esc(img) + "')" : ''); }
  var TODAY = (function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
  function upcoming(e){ var end = e.date_to || e.date_from; return !end || d(end) >= TODAY; }
  function shortCh(c){ return String(c || '').replace(/（長崎：(.+?)）/, '／$1'); }
  function clock(){ var n = new Date(); return n.getHours() + ':' + ('0' + n.getMinutes()).slice(-2); }
  function sortByDate(list, key){ return list.slice().sort(function(x,y){ var a = x[key] || '9999', b = y[key] || '9999'; return a < b ? -1 : a > b ? 1 : 0; }); }

  var ROWS = [];
  function recordingCards(data){
    var list = sortByDate(data.recording || [], 'start');
    (data.regular_programs || []).forEach(function(p){ if(p.start) list.push({ title:p.title, start:p.start, slot:p.slot, channel:p.channel, reason:'いつもの番組', summary:p.summary, image:p.image }); });
    ROWS[0] = list.map(function(r){ var w = r.start ? (function(){ var x = d(r.start); return md(x) + '（' + DOW[x.getDay()] + '） ' + r.start.slice(11,16) + ' ' + shortCh(r.channel); })() : (r.slot || '') + ' ' + shortCh(r.channel); return { kind:'rec', when:w, title:r.title, reason:r.reason, summary:r.summary, image:r.image }; });
    return list.map(function(r, i){
      var w = r.start ? (function(){ var x = d(r.start); return md(x) + ' ' + DOW[x.getDay()]; })() : (r.slot || '').split(' ')[0];
      var time = r.start ? r.start.slice(11,16) + ' ' : '';
      var label = r.kind === 'discovery' ? '<div class="chip" style="background:var(--teal)">出会いの1本</div>' : (r.is_premiere ? '<div class="chip" style="background:var(--amber)">新番組</div>' : '');
      return '<div class="card" tabindex="0" style="width:440px;height:220px;' + bg(r.image, i) + '">' + label +
        '<div class="shade"><div class="when"><b>' + esc(w) + '</b><span>' + esc(time + shortCh(r.channel)) + '</span></div>' +
        '<div class="t">' + esc(r.title) + '</div><div class="r">' + esc(r.reason) + '</div></div></div>';
    }).join('');
  }
  function streamingCards(data){
    ROWS[1] = (data.streaming || []).map(function(s){ return { kind:'vod', when:s.service + (s.start ? '　' + md(d(s.start)) + '〜配信' : ''), title:s.title, reason:s.reason, summary:s.summary, image:s.image }; });
    return (data.streaming || []).map(function(s, i){
      return '<div class="card' + (s.subscribed ? '' : ' dim') + '" tabindex="0" style="width:440px;height:170px;' + bg(s.image, i+3) + '">' +
        '<div class="chip" style="background:' + (s.subscribed ? 'var(--amber)' : '#B5B2AC') + '">' + esc(s.service + (s.subscribed ? '' : ' 参考')) + '</div>' +
        '<div class="shade"><div class="t">' + esc(s.title) + '</div><div class="r">' + esc(s.reason) + '</div></div></div>';
    }).join('');
  }
  function localCards(data){
    var list = sortByDate((data.local || []).filter(function(e){ return e.category !== 'day_trip' && upcoming(e); }), 'date_from');
    list = list.concat((data.local || []).filter(function(e){ return e.category === 'day_trip'; }));
    ROWS[2] = list.map(function(e){ var dp = dateParts(e.date_from, e.date_to); return { kind:'local', when:dp.main + ' ' + dp.sub, title:e.title, reason:e.genre + '｜' + e.place, summary:e.summary || e.note || '', image:e.image }; });
    return list.map(function(e, i){
      var dp = dateParts(e.date_from, e.date_to);
      var color = e.category === 'food' ? 'var(--amber)' : 'var(--teal)';
      return '<div class="card' + (e.category === 'day_trip' ? ' trip' : '') + '" tabindex="0" style="width:300px;height:240px;' + bg(e.image, i) + '">' +
        '<div class="date"><b>' + esc(dp.main) + '</b><span>' + esc(dp.sub) + '</span></div>' +
        '<div class="shade"><div class="tag" style="color:' + color + '">' + esc(e.genre) + '</div><div class="t" style="font-size:23px">' + esc(e.title) + '</div><div class="r" style="font-size:16px">' + esc(e.place) + '</div></div></div>';
    }).join('');
  }
  function movieLine(data){
    var m = data.movies || [];
    var soon = (data.coming_soon || []).map(function(c){ var p = dateParts(c.date_from, c.date_to); return p.main + '〜 ' + c.title; }).join('　／　');
    var mv = m.length ? m.map(function(x){ return '<div class="empty" style="color:var(--ink)">' + esc(x.title) + '<span style="color:var(--mute)">　' + esc(x.theater) + '・' + esc(x.reason) + '</span></div>'; }).join('') : '<div class="empty">今週はお気に入りの人の上映作品なし</div>';
    return mv + (soon ? '<div class="soon">近日：' + esc(soon) + '</div>' : '');
  }

  function renderBoard(data){
    var u = d(data.updated_at);
    stage.innerHTML =
      '<div class="board">' +
      '<div class="head"><div><h1 style="display:inline">今週のふたり</h1><span class="upd">' + esc(md(u) + '（' + DOW[u.getDay()] + '）更新') + (window.TV && window.TV.version ? '　｜　アプリ v' + window.TV.version() + '（9で更新）' : '') + '</span></div><div class="clock" id="clk">' + clock() + '</div></div>' +
      '<section><h2>録画候補<small>お気に入り・いつもの番組・出会いの1本' + (window.TV ? '　｜　決定で概要・番組表へ（0で番組表アプリを選び直し）' : '') + '</small></h2><div class="row">' + recordingCards(data) + '</div></section>' +
      '<section><h2>配信<small>プライムビデオ／他サービスは参考</small></h2><div class="row">' + streamingCards(data) + '</div></section>' +
      '<section><h2>長崎・佐賀<small>2週間分・日付順</small></h2><div class="row">' + localCards(data) + '</div></section>' +
      '<section><h2>映画（長崎で上映中）</h2><div style="display:flex;gap:12px;flex-wrap:wrap">' + movieLine(data) + '</div></section>' +
      '</div>';
    setInterval(function(){ var c = document.getElementById('clk'); if(c) c.textContent = clock(); }, 20000);
    setupKeys();
  }

  // リモコン（十字キー）で行内・行間を移動
  function setupKeys(){
    var all = Array.prototype.slice.call(stage.querySelectorAll('.row'));
    var rowMap = [];
    var rows = all.filter(function(r, i){ if(r.children.length){ rowMap.push(i); return true; } return false; });
    var detailEl = null, detailItem = null;
    function closeDetail(){ if(detailEl){ detailEl.remove(); detailEl = null; detailItem = null; return true; } return false; }
    window.onBack = closeDetail;
    function openDetail(it){
      if(!it) return;
      closeDetail(); detailItem = it;
      detailEl = document.createElement('div'); detailEl.className = 'detail';
      var hint = it.kind === 'rec' && window.TV ? 'もう一度「決定」で番組表アプリを開く　／　戻る・矢印キーで閉じる' : '戻る・矢印キーで閉じる';
      detailEl.innerHTML = '<div class="box"><div class="pic" style="' + bg(it.image, 0) + '"></div><div class="txt">' +
        '<div class="when2">' + esc(it.when) + '</div><div class="ttl">' + esc(it.title) + '</div><div class="rsn">' + esc(it.reason) + '</div>' +
        '<div class="sum">' + esc(it.summary || '（概要はまだありません）') + '</div><div class="hint">' + esc(hint) + '</div></div></div>';
      stage.appendChild(detailEl);
    }
    var ri = 0, ci = [0,0,0,0];
    function focus(){ var el = rows[ri].children[ci[ri]]; el.focus({preventScroll:true}); var row = rows[ri]; row.scrollLeft = Math.max(0, el.offsetLeft - row.offsetLeft - 48); }
    if(!rows.length) return;
    focus();
    document.addEventListener('keydown', function(e){
      if(detailEl){
        e.preventDefault();
        if((e.key === 'Enter' || e.keyCode === 23) && detailItem && detailItem.kind === 'rec' && window.TV){ closeDetail(); window.TV.openGuide(); }
        else closeDetail();
        return;
      }
      if(e.key === 'ArrowRight'){ ci[ri] = Math.min(ci[ri]+1, rows[ri].children.length-1); }
      else if(e.key === 'ArrowLeft'){ ci[ri] = Math.max(ci[ri]-1, 0); }
      else if(e.key === 'ArrowDown'){ ri = Math.min(ri+1, rows.length-1); }
      else if(e.key === 'ArrowUp'){ ri = Math.max(ri-1, 0); }
      else if(e.key === 'Enter' || e.keyCode === 23){ e.preventDefault(); openDetail(ROWS[rowMap[ri]] && ROWS[rowMap[ri]][ci[ri]]); return; }
      else if(e.key === '0' && window.TV){ e.preventDefault(); window.TV.chooseGuide(); return; }
      else if(e.key === '9' && window.TV && window.TV.updateApp){ e.preventDefault(); window.TV.updateApp(); return; }
      else return;
      e.preventDefault(); focus();
    });
  }

  function renderSaver(data){
    var slides = [];
    var local = sortByDate((data.local || []).filter(function(e){ return e.date_from && upcoming(e); }), 'date_from');
    for(var i = 0; i < local.length; i += 3){
      var chunk = local.slice(i, i+3);
      var img = (chunk.filter(function(x){ return x.image; })[0] || {}).image;
      slides.push({ label:'今週末の長崎・佐賀', img:img, items: chunk.map(function(e){ var p = dateParts(e.date_from, e.date_to); return { main:p.main, sub:p.sub, g:e.genre, gc: e.category==='food' ? 'var(--amber)' : 'var(--teal)', n:e.title }; }) });
    }
    var rec = sortByDate((data.recording || []).filter(function(r){ return r.start; }), 'start').slice(0,3);
    if(rec.length) slides.push({ label:'録画をお忘れなく', items: rec.map(function(r){ var x = d(r.start); return { main:md(x), sub:DOW[x.getDay()], g:r.start.slice(11,16) + ' ' + shortCh(r.channel), gc:'var(--amber)', n:r.title }; }) });
    var trip = (data.local || []).filter(function(e){ return e.category === 'day_trip'; })[0];
    if(trip) slides.push({ label:'日帰りでどう？', img:trip.image, items:[{ main:'週末', sub:'', g:'日帰り定番', gc:'var(--teal)', n:trip.title + '（' + trip.place + '）' }] });
    if(!slides.length){ stage.innerHTML = '<div class="err">表示する情報がありません</div>'; return; }

    var k = 0;
    function show(){
      var s = slides[k % slides.length]; k++;
      stage.innerHTML = '<div class="saver" style="background-color:' + PH[k % PH.length] + (s.img ? ";background-image:url('" + esc(s.img) + "')" : '') + '"><div class="veil">' +
        '<div class="top"><div class="lbl">' + esc(s.label) + '</div><div class="clock">' + clock() + '</div></div>' +
        '<div class="items">' + s.items.map(function(it){ return '<div class="it"><div class="d"><b>' + esc(it.main) + '</b><span>' + esc(it.sub) + '</span></div><div class="x"><div class="g" style="color:' + it.gc + '">' + esc(it.g) + '</div><div class="n">' + esc(it.n) + '</div></div></div>'; }).join('') + '</div>' +
        '<div class="foot">リモコンのボタンで一覧を開く</div></div></div>';
    }
    show(); setInterval(show, 12000);
  }

  fetch(DATA_URL + (DATA_URL.indexOf('?') < 0 ? '?t=' : '&t=') + Date.now())
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){ MODE === 'saver' ? renderSaver(data) : renderBoard(data); })
    .catch(function(err){ stage.innerHTML = '<div class="err">データを読み込めませんでした（' + esc(err.message) + '）</div>'; });
})();
</script>
</body>
</html>
