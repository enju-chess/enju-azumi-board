name: 投資シグナルのバックテスト

on:
  workflow_dispatch:
    inputs:
      per_tier:
        description: "規模区分ごとの銘柄数"
        default: "80"
      years:
        description: "検証する年数"
        default: "10"
      us:
        description: "S&P500から選ぶ銘柄数"
        default: "100"
      exclude_semis:
        description: "半導体関連を除く (yes/no)"
        default: "no"
      extra:
        description: "個別に追加する銘柄（カンマ区切り 例: GC=F,BTC-USD）"
        default: ""

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas xlrd openpyxl lxml
      - name: Run backtest
        working-directory: invest
        run: |
          set -o pipefail
          mkdir -p results
          python backtest_signals.py \
            --per-tier "${{ inputs.per_tier }}" \
            --years "${{ inputs.years }}" \
            --us "${{ inputs.us }}" \
            --extra "${{ inputs.extra }}" \
            $( [ "${{ inputs.exclude_semis }}" = "yes" ] && echo --exclude-semis ) 2>&1 | tee results/run.log
      - name: 結果を invest-results ブランチに保存
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r invest/results/. /tmp/out/ || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan invest-results
          git rm -rf -q . 
          cp -r /tmp/out/. .
          git add -A
          git commit -q -m "バックテスト結果 run ${{ github.run_id }}"
          git push -f origin invest-results
